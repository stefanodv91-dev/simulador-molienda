<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simulador de pago</title>
<style>
:root{--bg:#f3f5f7;--ink:#1c2530;--muted:#56616f;--line:#d3d9e0;--acc:#2f5d8a;--bad:#b3362a}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0} p{margin:0;color:var(--muted);font-size:14px}
label{font-weight:600;font-size:14px}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;width:100%}
button{font:inherit;font-weight:700;font-size:16px;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6} input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#err{color:var(--bad);font-weight:600;min-height:20px}
</style>
</head>
<body>
<form id="f">
<p style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:12px">Mineralium</p>
<h1>Simulador de pago</h1>
<div style="display:flex;flex-direction:column;gap:6px"><label for="pw">Clave</label><input id="pw" type="password" autocomplete="current-password" autofocus></div>
<button id="go" type="submit">Entrar</button>
<p id="err" role="alert"></p>
</form>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function mostrar(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  document.title=doc.title;
  document.head.innerHTML=doc.head.innerHTML;
  document.body.innerHTML=doc.body.innerHTML;
  document.body.removeAttribute("style");
  doc.querySelectorAll("script").forEach(old=>{ const sc=document.createElement("script"); sc.textContent=old.textContent; document.body.appendChild(sc); });
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const btn=document.getElementById("go"), err=document.getElementById("err");
  if(!(window.crypto && crypto.subtle)){ err.textContent="Este navegador no permite abrir la página protegida. Ábrela desde la dirección https:// de GitHub en Chrome o Safari."; return; }
  btn.disabled=true; btn.textContent="Abriendo…"; err.textContent="";
  let html;
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value.trim()),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},key,u(D.ct)));
  }catch(x){ err.textContent="Clave incorrecta. Intenta de nuevo."; btn.disabled=false; btn.textContent="Entrar"; return; }
  try{ mostrar(html); }catch(x){ err.textContent="La clave es correcta, pero este navegador no pudo mostrar el simulador: "+x.message; btn.disabled=false; btn.textContent="Entrar"; }
});
